services:
  - type: web
    runtime: static
    name: bengali-first-steps
    buildCommand: npm install && npm run build && npm run size
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
