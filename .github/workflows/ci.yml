name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Check build is static and relative
        run: |
          test -f dist/index.html
          ! grep -E '(src|href)="/[^/]' dist/index.html
      - run: npm run size
